# Chef's Loop - Local Development Stack
version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./src:/app/src:ro
      - ./backend:/app/backend:ro

  # Redis for caching (local development)
  # Using Upstash for production
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Frontend (development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # For phone testing on your LAN, swap localhost for your machine's IP.
      - VITE_API_URL=http://localhost:8000

  # --- Monitoring (disabled for now; files kept, uncomment to re-enable) ---
